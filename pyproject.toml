[project]
name = "interview-simulator"
version = "0.1.0"
description = "Interview by Rohan: AI mock interview simulator (resume + JD aware, voice, live coding) built on LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Orchestration + LLMs
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
    # Web research
    "tavily-python>=0.5",
    # Documents / JD
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # UI
    "streamlit>=1.40",
    "streamlit-ace>=0.1.1",
    # Voice
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "edge-tts>=6.1",
    # Audio decoding without ffmpeg (WAV from st.audio_input -> 16 kHz mono numpy)
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Cross-platform STT fallback (non-Apple-Silicon / deployment)
cpu-stt = ["faster-whisper>=1.0"]

[project.scripts]
interview-sim = "interview_simulator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# "if button clicked: if action succeeded: rerun" reads clearer nested in Streamlit code
"app/**" = ["SIM102"]
